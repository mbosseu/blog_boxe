name: Veille Actu Boxe — détection des sujets

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actu-boxe-news-discovery
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python news_bot.py collect
      - name: Commit if the feed changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news_candidates.json
          if git diff --staged --quiet; then
            echo "No feed changes"
            exit 0
          fi
          git commit -m "Refresh news candidates for editorial review"
          git pull --rebase origin main
          git push
