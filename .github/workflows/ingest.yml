name: Veille Actu Boxe

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python ingest_news.py
      - run: python build_pages.py
      - name: Commit if the feed changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data actu-boxe
          if git diff --staged --quiet; then
            echo "No feed changes"
            exit 0
          fi
          git commit -m "Refresh FFBoxe wires and Vu ailleurs headlines."
          git push
